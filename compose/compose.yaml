services:
  embedding-service:
    profiles: ["embeddings"]
    image: ${REVOLVR_EMBEDDING_IMAGE:-local/revolvr-embedding-service:operator-must-supply}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    gpus: all
    environment:
      REVOLVR_EMBEDDING_MODEL_PATH: /models/embedding
      REVOLVR_EMBEDDING_MODEL_NAME: Qwen/Qwen3-Embedding-0.6B-GGUF
      REVOLVR_EMBEDDING_MODEL_REVISION: 370f27d7550e0def9b39c1f16d3fbaa13aa67728
      REVOLVR_EMBEDDING_DIMENSIONS: "1024"
      REVOLVR_EMBEDDING_POOLING: last
      REVOLVR_EMBEDDING_NORMALIZATION: l2
      REVOLVR_EMBEDDING_QUANTIZATION: Q8_0
      REVOLVR_EMBEDDING_ARTIFACT_SHA256: 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439
    volumes:
      - type: bind
        source: ${REVOLVR_EMBEDDING_MODEL_PATH:-/var/lib/revolvr/models/embedding}
        target: /models/embedding
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    networks:
      - control

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: revolvr
      POSTGRES_USER: revolvr
      POSTGRES_PASSWORD: ${REVOLVR_POSTGRES_PASSWORD:?REVOLVR_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revolvr -d revolvr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  control:
    internal: true
