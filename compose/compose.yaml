services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: revolvr
      POSTGRES_USER: revolvr
      POSTGRES_PASSWORD: ${REVOLVR_POSTGRES_PASSWORD:?REVOLVR_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revolvr -d revolvr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  control:
    internal: true
